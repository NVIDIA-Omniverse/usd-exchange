[project]
name = "usd-exchange"
version = "0.0.0"  # generated from VERSION
description = "OpenUSD Exchange provides higher-level convenience functions as a companion to lower-level OpenUSD concepts"
authors = [{ name = "NVIDIA" }]
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "usd-exchange-LICENSE.md",
    "pybind11-LICENSE.txt",
    "pyboost11-LICENSE.txt",
    "usd-license.txt",
    "*tbb-LICENSE*",
    "*hwloc*",
    "zlib-LICENSE*",
]
requires-python = ">=3.10,<3.13"

[project.urls]
Homepage = "https://docs.omniverse.nvidia.com/usd/code-docs/usd-exchange-sdk"
Documentation = "https://docs.omniverse.nvidia.com/usd/code-docs/usd-exchange-sdk"
Repository = "https://github.com/NVIDIA-Omniverse/usd-exchange"
Changelog = "https://docs.omniverse.nvidia.com/usd/code-docs/usd-exchange-sdk/latest/docs/changes.html"

[project.optional-dependencies]  # generated at build time

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["usdex", "pxr", "usd_exchange.libs"]
# hatchling's built-in default exclude is `*.py[cdo]`, which (besides byte-compiled `.pyc`/`.pyo`) also matches
# Windows python extension modules (`.pyd`). Without re-including them, every native binding (e.g. `pxr/Tf/_tf.pyd`)
# is silently dropped from the windows wheel and `import pxr` fails with `No module named 'pxr.Tf._tf'`. `artifacts`
# force-includes them while `.pyc`/`__pycache__` stay excluded. (Linux bindings are `.so`, so they are unaffected.)
artifacts = ["*.pyd"]

# A custom build hook forces a platform/abi-tagged wheel, since the package bundles
# precompiled python bindings and shared libraries.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
